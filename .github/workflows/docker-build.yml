name: Build, Scan & Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/chrabaszcz03/zadanie1nob
  DOCKERHUB_CACHE: docker.io/chrabaszcz/zadanie1nob-cache

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # 1. Pobranie kodu 
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Konfiguracja QEMU 
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Konfiguracja Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Logowanie do GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Logowanie do DockerHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Generowanie  tagów 
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 7. Build tylko dla amd64, wynik zapisywany lokalnie do skanu
      - name: Build image (local export for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.GHCR_IMAGE }}:scan
          cache-from: type=registry,ref=${{ env.DOCKERHUB_CACHE }}:cache
          cache-to:   type=registry,ref=${{ env.DOCKERHUB_CACHE }}:cache,mode=max
          secrets: |
            github_token=${{ secrets.GH_PAT }}

      # 8. Skan CVE 
      - name: Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@0.71.0
        with:
          image-ref: "${{ env.GHCR_IMAGE }}:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 9. Push do GHCR
      - name: Push to GHCR
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_CACHE }}:cache
          cache-to:   type=registry,ref=${{ env.DOCKERHUB_CACHE }}:cache,mode=max
          secrets: |
            github_token=${{ secrets.GH_PAT }}